name: Apply V31 website
on:
  push:
    branches: [v31-deploy]
    paths:
      - '.v31_upload/READY'
permissions:
  contents: write
jobs:
  apply-v31:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply approved V31 package
        shell: bash
        run: |
          cat .v31_upload/script-*.txt > /tmp/apply_v31.py
          python /tmp/apply_v31.py
          rm -rf .v31_upload
          rm -rf v31-deploy-payload
          rm -f small_essay_data_14_confirmed.json
          rm -f .github/workflows/apply-v31.yml
      - name: Commit V31 website
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy V31 website"
          git push origin HEAD:v31-deploy
