name: Apply V31 website
on:
  push:
    branches: [v31-deploy]
    paths:
      - '.v31_upload/READY'
permissions:
  contents: write
jobs:
  apply-v31:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install patch tool
        run: sudo apt-get update && sudo apt-get install -y zstd
      - name: Apply approved V31 package
        shell: bash
        run: |
          base64 -d .v31_upload/v31_delta.tar.zst.b64 > /tmp/v31_delta.tar.zst
          zstd -q -d -c /tmp/v31_delta.tar.zst | tar -xf -
          bash v31_delta/apply.sh
          rm -rf .v31_upload
          rm -rf v31-deploy-payload
          rm -rf v31_delta_parts
          rm -f .github/workflows/apply-v31.yml
      - name: Commit V31 website
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy V31 website"
          git push origin HEAD:v31-deploy
